<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1420" />
    <meta
      name="description"
      content="Build daily habits, track your progress, and strengthen your discipline with a clear daily minimum."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Win Today — Habit Builder</title>
    <script>
      try {
        let t = localStorage.getItem("win-theme") || "dark";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {}
    </script>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (event.target?.tagName !== "SCRIPT") return;
          function showLoadFailure() {
            const boot = document.querySelector(".boot-loading");
            if (!boot || boot.dataset.failed) return;
            boot.dataset.failed = "true";
            boot.setAttribute("role", "alert");
            boot.setAttribute("aria-label", "App could not load");
            const message = document.getElementById("boot-message");
            if (message) message.textContent = "The app could not load.";
            boot.querySelector(".boot-loading-spinner")?.remove();
            const retry = document.getElementById("boot-retry");
            if (retry) retry.hidden = false;
          }
          if (document.readyState === "loading")
            document.addEventListener("DOMContentLoaded", showLoadFailure, {
              once: true,
            });
          else showLoadFailure();
        },
        true,
      );
    </script>
    <style>
      body {
        margin: 0;
      }
      .boot-loading {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        background: #0a111b;
        color: #ecf0f4;
        font-family: system-ui, sans-serif;
      }
      html[data-theme="light"] .boot-loading {
        background: #f5f7fa;
        color: #142335;
      }
      .boot-loading-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11px;
        font-size: 14px;
        font-weight: 600;
      }
      .boot-loading-status {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: #8c9baa;
      }
      html[data-theme="light"] .boot-loading-status {
        color: #607184;
      }
      .boot-loading-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #8173ff30;
        border-top-color: #8173ff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
        box-sizing: border-box;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading-spinner {
          animation: none;
        }
      }
      .boot-retry {
        border: 1px solid #243241;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        min-height: 44px;
        padding: 10px 15px;
        font:
          12px system-ui,
          sans-serif;
        cursor: pointer;
      }
      html[data-theme="light"] .boot-retry {
        border-color: #dce4ed;
      }
      .boot-retry[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="Loading app">
        <div class="boot-loading-brand">
          <img src="/icon.svg" alt="" width="42" height="42" /><span
            >Win Today</span
          >
        </div>
        <div class="boot-loading-status">
          <span class="boot-loading-spinner" aria-hidden="true"></span
          ><span id="boot-message">Loading…</span>
        </div>
        <button
          id="boot-retry"
          class="boot-retry"
          type="button"
          hidden
          onclick="window.location.reload()"
        >
          Reload
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
